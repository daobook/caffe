name: Build Caffe

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: quay.io/rockylinux/rockylinux:8
    steps:
      - uses: actions/checkout@v3

      - name: Set up development dependencies
        run: |
          yum update -y
          yum install -y gcc gcc-c++ python3-devel graphviz git make wget which \
                         libstdc++ libstdc++-devel centos-release-scl
          yum install -y rh-gcc-toolset-14 # 如果可用
          echo "source /opt/rh/gcc-toolset-14/enable" >> ~/.bashrc
          source /opt/rh/gcc-toolset-14/enable
          export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:$LD_LIBRARY_PATH

      - name: Install Conan & detect profile
        run: |
          pip install conan
          conan remote add conancenter https://center2.conan.io --force
          conan profile detect --force

      - name: Install project dependencies
        run: |
          export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:$LD_LIBRARY_PATH
          conan install . --build=missing -o boost:without_python=True

      - name: Build wheel
        run: |
          export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:$LD_LIBRARY_PATH
          python3 -m build --wheel
